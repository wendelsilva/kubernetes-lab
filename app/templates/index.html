<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K8s Task Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-red-hover: #dc2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
        }

        .container {
            width: 100%;
            max-width: 540px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 2.5rem;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header {
            margin-bottom: 2rem;
            text-align: center;
        }

        .badge {
            display: inline-block;
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border: 1px solid rgba(99, 102, 241, 0.2);
            margin-bottom: 0.75rem;
        }

        h1 {
            font-size: 2.25rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 40%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .task-form {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 2rem;
        }

        .task-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 0.85rem 1.25rem;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .task-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
            background: rgba(0, 0, 0, 0.3);
        }

        .btn-add {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 0.85rem 1.5rem;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-add:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .btn-add:active {
            transform: translateY(0);
        }

        .task-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1rem 1.25rem;
            transition: all 0.2s ease;
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .task-item:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.12);
            transform: scale(1.01);
        }

        .task-item.completed {
            border-color: rgba(16, 185, 129, 0.2);
            background: rgba(16, 185, 129, 0.02);
        }

        .task-left {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex: 1;
        }

        .toggle-form {
            display: flex;
            align-items: center;
        }

        .btn-toggle {
            background: none;
            border: 2px solid var(--text-secondary);
            width: 22px;
            height: 22px;
            border-radius: 6px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-toggle:hover {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .task-item.completed .btn-toggle {
            background: var(--accent-green);
            border-color: var(--accent-green);
        }

        .task-item.completed .btn-toggle::after {
            content: "✓";
            color: white;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .task-title {
            font-size: 1.05rem;
            color: var(--text-primary);
            transition: all 0.2s ease;
            word-break: break-word;
        }

        .task-item.completed .task-title {
            text-decoration: line-through;
            color: var(--text-secondary);
            opacity: 0.7;
        }

        .btn-delete {
            background: rgba(239, 68, 68, 0.1);
            color: var(--accent-red);
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .btn-delete:hover {
            background: var(--accent-red);
            color: white;
            box-shadow: 0 4px 10px rgba(239, 68, 68, 0.2);
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .pod-info {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            padding: 0.4rem 0.8rem;
            border-radius: 10px;
            font-family: monospace;
            font-size: 0.75rem;
            color: #a5b4fc;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px var(--accent-green);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <span class="badge">Kubernetes Lab</span>
            <h1 id="main-title">Minhas Tarefas</h1>
            <p>Gerenciamento de tarefas local integrado ao PostgreSQL</p>
        </header>

        <form class="task-form" action="/add" method="POST">
            <input type="text" name="title" class="task-input" placeholder="Nova tarefa..." required autocomplete="off" id="task-input-field">
            <button type="submit" class="btn-add" id="task-add-button">
                Adicionar
            </button>
        </form>

        {{if .Tasks}}
            <ul class="task-list">
                {{range .Tasks}}
                    <li class="task-item {{if .Done}}completed{{end}}">
                        <div class="task-left">
                            <form action="/toggle" method="POST" class="toggle-form">
                                <input type="hidden" name="id" value="{{.ID}}">
                                <button type="submit" class="btn-toggle" title="Alterar status"></button>
                            </form>
                            <span class="task-title">{{.Title}}</span>
                        </div>
                        <form action="/delete" method="POST">
                            <input type="hidden" name="id" value="{{.ID}}">
                            <button type="submit" class="btn-delete" title="Deletar tarefa">✕</button>
                        </form>
                    </li>
                {{end}}
            </ul>
        {{else}}
            <div class="empty-state">
                <div class="empty-icon">✓</div>
                <p>Nenhuma tarefa pendente. Tudo limpo!</p>
            </div>
        {{end}}
    </div>

    <footer>
        <div class="pod-info">
            <span class="dot"></span> Pod Host: <span id="pod-hostname">{{.Hostname}}</span>
        </div>
        <div>Kubernetes Lab &copy; 2026</div>
    </footer>
</body>
</html>
